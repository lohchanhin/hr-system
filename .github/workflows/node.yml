name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      APPROVAL_ENGINE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/hr_test
      PDF_CHINESE_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      PDF_CHINESE_FONT_NAME: NotoSansCJKtc-Regular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install Traditional Chinese font for PDF tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm ci
      - name: Run server tests
        run: npm --prefix server test -- --runInBand

  client-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run client tests
        run: npm --prefix client test -- --run
      - name: Build client
        run: npm --prefix client run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix server audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high

